<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- This page lives in /seller/, so base makes the shared header's links resolve from the site root -->
  <base href="/" />
  <title>Sewist — Hemline Market</title>
  <meta name="description" content="View this sewist's shop and fabrics on Hemline Market." />

  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/styles/hm-header.css" />
  <link rel="stylesheet" href="/styles/hm-footer.css" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />

  <style>
    .sp-wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }

    /* Profile hero */
    .sp-hero {
      display: flex; align-items: center; gap: 20px;
      background: #fff; border: 1px solid #eaeaea; border-radius: 16px;
      padding: 24px; box-shadow: 0 2px 10px rgba(0,0,0,.04); margin-bottom: 28px;
    }
    .sp-avatar {
      width: 96px; height: 96px; border-radius: 999px; flex: 0 0 auto;
      background: #991b1b center/cover no-repeat; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 700; letter-spacing: 1px;
    }
    .sp-id { min-width: 0; }
    .sp-name { font-size: 26px; font-weight: 800; color: #1f2937; margin: 0 0 4px; }
    .sp-sub { color: #6b7280; font-size: 14px; margin: 0 0 10px; }
    .sp-bio { color: #374151; font-size: 15px; line-height: 1.5; margin: 0; max-width: 640px; }

    .sp-section-title { font-size: 20px; font-weight: 800; color: #1f2937; margin: 0 0 16px; }

    /* Listings grid */
    .sp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    @media (max-width: 900px) { .sp-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 520px) { .sp-grid { grid-template-columns: 1fr; } }

    .sp-card {
      display: block; text-decoration: none; color: inherit;
      background: #fff; border: 1px solid #eaeaea; border-radius: 14px; overflow: hidden;
      box-shadow: 0 1px 6px rgba(0,0,0,.05); transition: box-shadow .15s, transform .15s;
    }
    .sp-card:hover { box-shadow: 0 6px 18px rgba(0,0,0,.12); transform: translateY(-2px); }
    .sp-thumb { width: 100%; aspect-ratio: 1 / 1; background: #f3f4f6 center/cover no-repeat; }
    .sp-cbody { padding: 12px 14px 16px; }
    .sp-ctitle { font-size: 14px; font-weight: 600; color: #1f2937; margin: 0 0 6px; line-height: 1.35; }
    .sp-cmeta { font-size: 13px; color: #6b7280; }
    .sp-price { color: #991b1b; font-weight: 700; }

    .sp-empty, .sp-loading {
      text-align: center; color: #6b7280; padding: 48px 16px; font-size: 15px;
    }
  </style>
</head>
<body>
  <div id="hm-shell-header"></div>

  <main class="sp-wrap">
    <div id="spHero" class="sp-loading">Loading sewist…</div>
    <h2 class="sp-section-title" id="spListingsTitle" style="display:none;">Fabrics for sale</h2>
    <div id="spListings" class="sp-grid"></div>
  </main>

  <div id="hm-shell-footer"></div>

  <!-- Supabase + shared header/footer -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/scripts/hm-shell.js"></script>

  <script>
    // 1) Render the shared header/footer (also creates the shared Supabase client)
    window.HM && window.HM.renderShell && window.HM.renderShell({ currentPage: "seller" });

    var supabaseClient = window.supabase_client || (window.HM && window.HM.supabase);
    if (!supabaseClient && window.supabase) {
      supabaseClient = window.supabase.createClient(
        "https://clkizksbvxjkoatdajgd.supabase.co",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsa2l6a3Nidnhqa29hdGRhamdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ2ODAyMDUsImV4cCI6MjA3MDI1NjIwNX0.m3wd6UAuqxa7BpcQof9mmzd8zdsmadwGDO0x7-nyBjI",
        { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
      );
      window.supabase_client = supabaseClient;
    }

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function displayName(p) {
      return p.store_name || p.display_name ||
        [p.first_name, p.last_name].filter(Boolean).join(" ") || "Sewist";
    }

    function initials(name) {
      return String(name || "S").trim().split(/\s+/).map(function (n) { return n[0]; })
        .join("").toUpperCase().slice(0, 2);
    }

    function priceStr(l) {
      if (l.price_cents != null) return (Number(l.price_cents) / 100).toFixed(2);
      if (l.price != null) return Number(l.price).toFixed(2);
      return null;
    }

    function listingImage(l) {
      return l.image_url_1 || (l.image_urls && l.image_urls[0]) || l.image_url || "/images/empty-state.svg";
    }

    function renderHero(p) {
      var hero = document.getElementById("spHero");
      var name = displayName(p);
      document.title = name + " — Hemline Market";
      var avatarStyle = p.avatar_url
        ? ' style="background-image:url(\'' + esc(p.avatar_url) + '\');"'
        : "";
      var avatarInner = p.avatar_url ? "" : esc(initials(name));
      hero.className = "sp-hero";
      hero.innerHTML =
        '<div class="sp-avatar"' + avatarStyle + '>' + avatarInner + '</div>' +
        '<div class="sp-id">' +
          '<h1 class="sp-name">' + esc(name) + '</h1>' +
          '<p class="sp-sub">Sewist on Hemline Market</p>' +
          (p.bio ? '<p class="sp-bio">' + esc(p.bio) + '</p>' : '') +
        '</div>';
    }

    function renderListings(rows) {
      var wrap = document.getElementById("spListings");
      var title = document.getElementById("spListingsTitle");
      title.style.display = "";
      if (!rows || !rows.length) {
        title.textContent = "Fabrics for sale";
        wrap.innerHTML = '<div class="sp-empty">This sewist has not listed any fabrics yet.</div>';
        return;
      }
      title.textContent = "Fabrics for sale (" + rows.length + ")";
      wrap.innerHTML = rows.map(function (l) {
        var price = priceStr(l);
        var yards = l.yards_available;
        var meta = "";
        if (price) meta += '<span class="sp-price">$' + price + '/yd</span>';
        if (yards != null) meta += (price ? " · " : "") + yards + " yd";
        return '<a class="sp-card" href="/listing.html?id=' + encodeURIComponent(l.id) + '">' +
          '<div class="sp-thumb" style="background-image:url(\'' + esc(listingImage(l)) + '\');"></div>' +
          '<div class="sp-cbody">' +
            '<p class="sp-ctitle">' + esc(l.title || "Untitled fabric") + '</p>' +
            '<div class="sp-cmeta">' + meta + '</div>' +
          '</div>' +
        '</a>';
      }).join("");
    }

    async function load() {
      var id = new URLSearchParams(window.location.search).get("id");
      var hero = document.getElementById("spHero");

      if (!id) {
        hero.className = "sp-empty";
        hero.textContent = "No sewist selected.";
        return;
      }
      if (!supabaseClient) {
        hero.className = "sp-empty";
        hero.textContent = "Could not connect. Please refresh.";
        return;
      }

      // Profile
      var profileRes = await supabaseClient
        .from("profiles")
        .select("id, display_name, store_name, first_name, last_name, bio, avatar_url, created_at")
        .eq("id", id)
        .single();

      if (profileRes.error || !profileRes.data) {
        hero.className = "sp-empty";
        hero.textContent = "Sewist not found.";
        return;
      }
      renderHero(profileRes.data);

      // Their active, published listings
      var listRes = await supabaseClient
        .from("listings")
        .select("id, title, price, price_cents, yards_available, image_url_1, image_urls, image_url, status, is_published, created_at")
        .eq("seller_id", id)
        .eq("status", "ACTIVE")
        .eq("is_published", true)
        .gt("yards_available", 0)
        .order("created_at", { ascending: false });

      renderListings(listRes.error ? [] : listRes.data);
    }

    load();
  </script>
</body>
</html>
